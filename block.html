      color: white;
      min-height: 100vh;
      text-align: center;

      background: url("images/rocky-water-clean.gif") center / cover no-repeat fixed;
    }

    /* Dark tint overlay */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: -1;
    }

    /* Header */
    header {
      background-color: rgba(0, 0, 0, 0.7);
      padding: 10px 0;

      width: 100%;

      display: flex;
      justify-content: center;
      padding: 0;
      margin: 0;
      flex-wrap: wrap;
    }

    .nav-list li {
      margin: 0 15px;
    }

    .nav-list a {
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 16px;
    }

    .nav-list a:hover {
      color: #1e90ff;
    }

    /* Main content */
    main {
      padding: 120px 20px 40px;
      display: flex;
      justify-content: center;
    }

    /* Dark box like the DMCA page */
    .button-box {
      max-width: 1000px;
      width: 100%;
      background-color: rgba(0, 0, 0, 0.65);
      padding: 30px;
      border-radius: 12px;
      backdrop-filter: blur(2px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    /* Horizontal buttons */
    .button-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .blue-button {
      display: inline-block;
      background-color: #0284d4;
      color: white;
      text-decoration: none;
      font-size: 18px;
      font-weight: bold;
      padding: 18px 25px;
      border-radius: 10px;

      box-shadow: 0 5px 12px rgba(0, 0, 0, 0.6);

      transition:
        transform 0.2s ease,
        background-color 0.2s ease,
        box-shadow 0.2s ease;
    }

    .blue-button:hover {
      background-color: #1e90ff;
      transform: translateY(-3px);

      box-shadow: 0 8px 18px rgba(0, 0, 0, 0.8);
    }

    .blue-button:active {
      transform: translateY(1px);
    }
  </style>
